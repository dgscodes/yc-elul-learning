<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Today's sponsorship poster · YC Elul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root{
    --night:#070C16; --night-1:#0A101C; --night-2:#101A2C;
    --gold:#D6B26A; --gold-bright:#F0D294;
    --on-night:#F2ECDF; --on-night-2:#B9C4D4; --on-night-3:#7E8CA3;
    --rule:rgba(214,178,106,.2);
    --body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --display:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--on-night);font-family:var(--body);font-size:15px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:2rem 1.2rem 4rem}

  h1{font-family:var(--display);font-weight:500;font-size:1.9rem;margin:0 0 .3rem;letter-spacing:-.01em}
  .sub{color:var(--on-night-3);margin:0 0 1.6rem;font-size:.92rem}

  .controls{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin-bottom:1.2rem}
  button,select{
    font:inherit;font-size:.85rem;padding:.6rem 1rem;border-radius:8px;
    border:1px solid var(--rule);background:var(--night-2);color:var(--on-night);cursor:pointer;
  }
  button:hover,select:hover{border-color:var(--gold)}
  button.primary{background:linear-gradient(150deg,var(--gold-bright),var(--gold));color:#231705;border-color:transparent;font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .stage{display:flex;flex-direction:column;gap:1rem;align-items:center}
  .stage canvas{
    width:100%;max-width:420px;height:auto;display:block;border-radius:10px;
    box-shadow:0 30px 60px -30px #000;
  }
  .empty{
    width:100%;max-width:420px;aspect-ratio:4/5;border:1px dashed var(--rule);border-radius:10px;
    display:grid;place-items:center;text-align:center;color:var(--on-night-3);font-size:.9rem;padding:2rem;
  }
  .status{font-size:.88rem;color:var(--gold-bright);min-height:1.3em;text-align:center;margin:0}
  .hint{font-size:.82rem;color:var(--on-night-3);margin:1.4rem 0 0;text-align:center}
  .pager{display:flex;gap:.5rem;align-items:center;justify-content:center;font-size:.85rem;color:var(--on-night-3)}
</style>
</head>
<body>

<div class="wrap">
  <h1>Today's sponsorship</h1>
  <p class="sub">A poster of the day's learning, sized for WhatsApp. Save it, or share it straight from your phone.</p>

  <div class="controls">
    <select id="day"></select>
    <select id="size">
      <option value="1080x1350">Post — 1080 × 1350</option>
      <option value="1080x1920">Status — 1080 × 1920</option>
      <option value="1080x1080">Square — 1080 × 1080</option>
    </select>
    <button type="button" id="btnReload">Refresh</button>
  </div>

  <div class="stage">
    <div id="stage"></div>
    <p class="status" id="status"></p>
    <div class="pager" id="pager" hidden>
      <button type="button" id="prev">‹</button>
      <span id="pagerLabel"></span>
      <button type="button" id="next">›</button>
    </div>
    <div class="controls" style="justify-content:center">
      <button type="button" id="btnShare" class="primary" disabled>Share</button>
      <button type="button" id="btnSave" disabled>Save PNG</button>
    </div>
  </div>

  <p class="hint">
    On a phone, <strong>Share</strong> hands the image straight to WhatsApp.
    On a computer it saves the file, which you then attach as normal.
  </p>
</div>

<script src="card-render.js"></script>
<script>
(function(){
"use strict";

var FEED = "https://script.google.com/macros/s/AKfycbyxLZ54K7FTOmK42yDkjT49EiK2_H1TEAWH12cxN6auvGLDBT_wA8d5lw59XaSyB0sK/exec";

var ELUL_START = new Date(2026, 7, 14);
var ELUL_DAYS  = 29;

var LEADS = [
  ["in memory of",               "In memory of",               "לעילוי נשמת"],
  ["for the refuah shleimah of", "For the refuah shleimah of", "לרפואה שלמה"],
  ["in honour of",               "In honour of",               "לכבוד"],
  ["for the hatzlacha of",       "For the hatzlacha of",       "להצלחת"],
  ["in gratitude for",           "In gratitude for",           ""]
];

var $ = function(s){ return document.querySelector(s); };
var statusEl = $("#status");
var cards = [], idx = 0;

function setStatus(m){ statusEl.textContent = m || ""; }

function dayDate(n){
  var d = new Date(ELUL_START);
  d.setDate(d.getDate() + (n - 1));
  return d;
}

/* Which day of Elul today is — 0 before it starts, so the picker can
   fall back to the first day rather than showing nothing. */
function todayElul(){
  var t = new Date(); t.setHours(0,0,0,0);
  var s = new Date(ELUL_START); s.setHours(0,0,0,0);
  var n = Math.round((t - s) / 86400000) + 1;
  return (n >= 1 && n <= ELUL_DAYS) ? n : 0;
}

function scheduled(n, seder){
  var dow = dayDate(n).getDay();
  if(seder === "night") return dow >= 1 && dow <= 4;
  return dow !== 6;
}

function parseTable(text){
  var delim = text.indexOf("\t") > -1 ? "\t" : ",";
  var out = [], row = [], field = "", q = false, i, c;
  for(i = 0; i < text.length; i++){
    c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(field); field = ""; }
    else if(c === "\n"){ row.push(field); out.push(row); row = []; field = ""; }
    else if(c !== "\r") field += c;
  }
  if(field !== "" || row.length){ row.push(field); out.push(row); }
  if(out.length < 2) return [];
  var head = out.shift().map(function(h){ return h.trim().toLowerCase(); });
  return out.filter(function(r){
    return r.some(function(v){ return v.trim() !== ""; });
  }).map(function(r){
    var o = {}; head.forEach(function(h,k){ o[h] = (r[k]||"").trim(); }); return o;
  });
}

function pick(o, names){
  for(var i = 0; i < names.length; i++){
    var k = names[i].toLowerCase();
    if(o[k] !== undefined && String(o[k]).trim() !== "") return String(o[k]).trim();
  }
  return "";
}

function leadPair(raw){
  var v = String(raw || "").toLowerCase().trim();
  for(var i = 0; i < LEADS.length; i++) if(LEADS[i][0] === v) return { en: LEADS[i][1], heb: LEADS[i][2] };
  return { en: raw ? String(raw).trim() : "In memory of", heb: "" };
}

function sedarim(raw){
  var v = String(raw || "").toLowerCase();
  if(v.indexOf("night") > -1) return ["night"];
  if(v.indexOf("both") > -1)  return ["morning","night"];
  return ["morning"];
}

var fmtLong = new Intl.DateTimeFormat("en-GB", { weekday:"long", day:"numeric", month:"long" });

function toCards(list){
  var out = [];
  list.forEach(function(r){
    var n = parseInt(pick(r, ["elul day","day"]), 10);
    var name = pick(r, ["name","dedication name"]);
    if(!(n >= 1 && n <= ELUL_DAYS) || !name) return;

    var lead = leadPair(pick(r, ["dedication type","type","lead"]));
    var anon = /^y/i.test(pick(r, ["anonymous"]));
    var from = pick(r, ["sponsored by","from"]);

    sedarim(pick(r, ["seder"])).forEach(function(s){
      if(!scheduled(n, s)) return;
      out.push({
        day: n, seder: s,
        lead: lead.en, hebLead: lead.heb,
        name: name, heb: pick(r, ["hebrew name","heb"]),
        footer: anon ? "Sponsored anonymously"
              : (from ? "Sponsored by " + from : "Today's learning is dedicated in their name"),
        slot: n + " Elul  ·  " + fmtLong.format(dayDate(n)) + "  ·  " +
              (s === "night" ? "Night Seder" : "Morning Seder")
      });
    });
  });
  out.sort(function(a,b){ return a.day - b.day || (a.seder === "morning" ? -1 : 1); });
  return out;
}

var all = [];

function currentSize(){
  var v = $("#size").value.split("x");
  return { W: parseInt(v[0], 10), H: parseInt(v[1], 10) };
}

var canvas = null;

function draw(){
  var host = $("#stage");
  host.innerHTML = "";
  canvas = null;
  $("#btnShare").disabled = true;
  $("#btnSave").disabled  = true;

  var c = cards[idx];
  if(!c){
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No sponsorship for that day yet.";
    host.appendChild(e);
    $("#pager").hidden = true;
    setStatus("");
    return;
  }

  var s = currentSize();
  canvas = CARD.toCanvas({
    W: s.W, H: s.H, layout: "portrait",
    kicker:  "YC LEARNING PROGRAM  ·  ELUL 5786",
    slot:    c.slot,
    lead:    c.lead,
    name:    c.name,
    hebLead: c.hebLead,
    heb:     c.heb,
    footer:  c.footer
  });
  host.appendChild(canvas);

  $("#btnShare").disabled = false;
  $("#btnSave").disabled  = false;
  $("#pager").hidden = cards.length < 2;
  $("#pagerLabel").textContent = (idx + 1) + " of " + cards.length;
  setStatus("");
}

function selectDay(n){
  cards = all.filter(function(c){ return c.day === n; });
  idx = 0;
  draw();
}

/* ?day=7 lands on a given day, which is what the daily email links
   to. ?size=1080x1920 picks the format. Anything missing or silly
   falls back to today. */
function fromQuery(name){
  var m = new RegExp("[?&]" + name + "=([^&]+)").exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : "";
}

function fillDays(){
  var sel = $("#day");
  sel.innerHTML = "";
  for(var n = 1; n <= ELUL_DAYS; n++){
    var has = all.some(function(c){ return c.day === n; });
    var o = document.createElement("option");
    o.value = String(n);
    o.textContent = n + " Elul — " + fmtLong.format(dayDate(n)) + (has ? "" : "  (open)");
    sel.appendChild(o);
  }

  var wantSize = fromQuery("size");
  if(wantSize && $("#size").querySelector('option[value="' + wantSize + '"]')){
    $("#size").value = wantSize;
  }

  var asked = parseInt(fromQuery("day"), 10);
  var t = (asked >= 1 && asked <= ELUL_DAYS) ? asked : (todayElul() || 1);
  sel.value = String(t);
  selectDay(t);
}

function filename(){
  var c = cards[idx];
  return "elul-" + (c ? c.day : "poster") + "-" + (c ? c.seder : "") + ".png";
}

function blob(){
  return new Promise(function(res, rej){
    if(!canvas) return rej();
    canvas.toBlob(function(b){ b ? res(b) : rej(); }, "image/png");
  });
}

$("#btnSave").addEventListener("click", function(){
  if(!canvas) return;
  var a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = filename();
  document.body.appendChild(a); a.click(); a.remove();
  setStatus("Saved.");
});

/* Web Share with a file attached is what puts the image directly into
   WhatsApp. Where that isn't supported, saving is the honest fallback
   rather than a share sheet that drops the picture. */
$("#btnShare").addEventListener("click", function(){
  blob().then(function(b){
    var file = new File([b], filename(), { type: "image/png" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      return navigator.share({
        files: [file],
        title: "Today's learning",
        text: cards[idx] ? cards[idx].lead + " " + cards[idx].name : ""
      });
    }
    $("#btnSave").click();
    setStatus("Your browser can't hand images to WhatsApp — saved it instead.");
  }).catch(function(){ /* dismissed the share sheet */ });
});

$("#day").addEventListener("change", function(){ selectDay(parseInt(this.value, 10)); });
$("#size").addEventListener("change", draw);
$("#prev").addEventListener("click", function(){ if(idx > 0){ idx--; draw(); } });
$("#next").addEventListener("click", function(){ if(idx < cards.length - 1){ idx++; draw(); } });

function load(){
  setStatus("Loading…");
  fetch(FEED, { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function(txt){
      all = toCards(txt.trim().charAt(0) === "[" ? JSON.parse(txt) : parseTable(txt));
      fillDays();
    })
    .catch(function(){
      setStatus("Couldn't reach the sheet. Check your connection and refresh.");
      fillDays();
    });
}

$("#btnReload").addEventListener("click", load);

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(load);
} else {
  load();
}

})();
</script>
</body>
</html>
