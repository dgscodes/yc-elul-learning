# Renders the day's dedication poster and commits it, so the daily
# email has a real PNG to attach. Runs the actual page in a real
# browser — there is no second copy of the design to keep in step.
name: Daily poster

on:
  schedule:
    # 03:10 UTC = 05:10 SAST, before the 06:00 email goes out.
    # August and September only — Elul 5786 is 14 Aug – 11 Sep 2026.
    - cron: "10 3 * 8,9 *"
  workflow_dispatch:
    inputs:
      day:
        description: "Elul day to render (blank = today)"
        required: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Render today's poster
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            node tools/render-poster.mjs --day "${{ inputs.day }}"
          else
            node tools/render-poster.mjs
          fi

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daily
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Daily poster: $(date -u +%Y-%m-%d)"
            git push
          fi
